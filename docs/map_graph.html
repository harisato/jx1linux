<html lang="vi">
<head>
<meta charset="UTF-8">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #1a1a2e; color: #eee; }
#header {
    background: #16213e; padding: 12px 24px; display: flex; align-items: center;
    justify-content: space-between; border-bottom: 2px solid #e74c3c; flex-wrap: wrap; gap: 8px;
}
#header h1 { font-size: 20px; color: #f1c40f; }
#header .stats { font-size: 13px; color: #bdc3c7; }
#controls {
    background: #16213e; padding: 10px 24px; display: flex; gap: 12px;
    align-items: center; flex-wrap: wrap; border-bottom: 1px solid #2c3e50;
}
#controls label { font-size: 13px; color: #bdc3c7; }
#controls select, #controls input {
    background: #0f3460; border: 1px solid #2c3e50; color: #eee;
    padding: 5px 10px; border-radius: 4px; font-size: 13px;
}
#controls button {
    background: #e74c3c; color: white; border: none; padding: 6px 14px;
    border-radius: 4px; cursor: pointer; font-size: 13px;
}
#controls button:hover { background: #c0392b; }
#controls button.secondary { background: #2c3e50; }
#controls button.secondary:hover { background: #34495e; }
#main { display: flex; height: calc(100vh - 110px); }
#graph { flex: 1; background: #0a0a1a; }
#sidebar {
    width: 340px; background: #16213e; border-left: 1px solid #2c3e50;
    overflow-y: auto; padding: 16px; display: none;
}
#sidebar.active { display: block; }
#sidebar h2 { color: #f1c40f; font-size: 16px; margin-bottom: 12px; }
#sidebar .map-info { margin-bottom: 16px; }
#sidebar .map-info .id { color: #e74c3c; font-weight: bold; }
#sidebar .map-info .type {
    display: inline-block; padding: 2px 8px; border-radius: 10px;
    font-size: 11px; font-weight: bold; margin-left: 6px;
}
#sidebar .connections { list-style: none; }
#sidebar .connections li {
    padding: 6px 10px; margin: 3px 0; background: #0f3460; border-radius: 4px;
    cursor: pointer; font-size: 13px; transition: background 0.2s;
}
#sidebar .connections li:hover { background: #1a5276; }
#sidebar .connections li .arrow { color: #e74c3c; margin-right: 6px; }
#legend {
    position: absolute; bottom: 16px; left: 16px; background: rgba(22,33,62,0.95);
    padding: 12px 16px; border-radius: 8px; border: 1px solid #2c3e50; z-index: 10;
}
#legend h3 { font-size: 13px; color: #f1c40f; margin-bottom: 8px; }
#legend .item { display: flex; align-items: center; gap: 8px; font-size: 12px; margin: 4px 0; }
#legend .dot {
    width: 14px; height: 14px; border-radius: 50%; border: 1px solid #2c3e50;
    display: inline-block;
}
#path-result {
    background: #0f3460; padding: 10px 14px; border-radius: 6px; margin-top: 12px;
    font-size: 13px; line-height: 1.8; display: none;
}
#path-result .step { color: #f1c40f; }
#path-result .sep { color: #e74c3c; margin: 0 4px; }
</style>
</head>

<div id="header">

    </div>
    <div id="sidebar">

        <div id="sidebarContent"></div>
        <div id="path-result"></div>
    </div>
</div>

const nodes = new vis.DataSet(nodesData);
const edges = new vis.DataSet(edgesData);
let network;

const container = document.getElementById('graph');
const options = {
    physics: {
        enabled: true,
        solver: 'forceAtlas2Based',
        forceAtlas2Based: {
            gravitationalConstant: -80,
            centralGravity: 0.01,
            springLength: 120,
            springConstant: 0.04,
            damping: 0.4,
        },
        stabilization: { iterations: 300 },
    },
    interaction: {
        hover: true,
        tooltipDelay: 100,
        navigationButtons: true,
        keyboard: true,
        zoomView: true,
    },
    edges: {
        smooth: { type: 'continuous', roundness: 0.2 },
    },
    layout: { improvedLayout: true },
};

network = new vis.Network(container, { nodes, edges }, options);

// Populate path selectors
const sortedNodes = [...nodesData].sort((a,b) => a.id - b.id);
const fromSel = document.getElementById('pathFrom');
const toSel = document.getElementById('pathTo');
sortedNodes.forEach(n => {
    const o1 = document.createElement('option');
    o1.value = n.id; o1.textContent = `[${n.id}] ${n.label}`;
    fromSel.appendChild(o1);
    const o2 = o1.cloneNode(true);
    toSel.appendChild(o2);
});

// Build adjacency list
const adj = {};
edgesData.forEach(e => {
    if (!adj[e.from]) adj[e.from] = [];
    if (!adj[e.to]) adj[e.to] = [];
    adj[e.from].push(e.to);
    if (!e.arrows) adj[e.to].push(e.from);
});

// Node click handler
network.on('click', params => {
    if (params.nodes.length > 0) {
        showNodeInfo(params.nodes[0]);
    }
});

function showNodeInfo(nodeId) {
    const sidebar = document.getElementById('sidebar');
    const content = document.getElementById('sidebarContent');
    sidebar.classList.add('active');

    const node = nodesData.find(n => n.id === nodeId);
    if (!node) return;

    const typeColors = {"City": "#e74c3c", "Capital": "#c0392b", "Country": "#2ecc71", "Field": "#3498db", "Cave": "#9b59b6", "Tong": "#f39c12", "Battlefield": "#e67e22", "Others": "#95a5a6", "Unknown": "#7f8c8d"};
    const connected = adj[nodeId] || [];
    const connHtml = connected.map(cid => {
        const cn = nodesData.find(n => n.id === cid);
        const name = cn ? cn.label : `Map ${cid}`;
        const t = cn ? cn.group : 'Unknown';
        return `<li onclick="focusNode(${cid})"><span class="arrow">→</span>[${cid}] ${name} <span class="type" style="background:${typeColors[t] || '#7f8c8d'}">${t}</span></li>`;
    }).join('');

    content.innerHTML = `
        <div class="map-info">
            <span class="id">[${node.id}]</span> <strong>${node.label}</strong>
            <span class="type" style="background:${typeColors[node.group] || '#7f8c8d'}">${node.group}</span>
        </div>
        <p style="font-size:13px;color:#bdc3c7;margin-bottom:12px">
            Số kết nối: <strong>${connected.length}</strong>
        </p>
        <h3 style="font-size:14px;margin-bottom:8px;color:#3498db">Có thể đi đến:</h3>
        <ul class="connections">${connHtml || '<li style="color:#95a5a6">Không có kết nối</li>'}</ul>
    `;
    document.getElementById('path-result').style.display = 'none';

    // Highlight
    network.selectNodes([nodeId]);
}

function focusNode(nodeId) {
    network.focus(nodeId, { scale: 1.2, animation: true });
    network.selectNodes([nodeId]);
    showNodeInfo(nodeId);
}

function searchMap() {
    const q = document.getElementById('searchInput').value.toLowerCase().trim();
    if (!q) return;
    const found = nodesData.find(n =>
        n.id.toString() === q || n.label.toLowerCase().includes(q)
    );
    if (found) {
        focusNode(found.id);
    } else {
        alert('Không tìm thấy bản đồ: ' + q);
    }
}

document.getElementById('searchInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') searchMap();
});

function findPath() {
    const from = parseInt(document.getElementById('pathFrom').value);
    const to = parseInt(document.getElementById('pathTo').value);
    if (!from || !to) { alert('Chọn map xuất phát và đích'); return; }
    if (from === to) { alert('Map xuất phát và đích giống nhau'); return; }

    // BFS
    const visited = new Set();
    const parent = {};
    const queue = [from];
    visited.add(from);
    parent[from] = -1;
    let found = false;

    while (queue.length > 0) {
        const cur = queue.shift();
        const neighbors = adj[cur] || [];
        for (const next of neighbors) {
            if (!visited.has(next)) {
                visited.add(next);
                parent[next] = cur;
                if (next === to) { found = true; break; }
                queue.push(next);
            }
        }
        if (found) break;
    }

    const sidebar = document.getElementById('sidebar');
    sidebar.classList.add('active');
    const pathResult = document.getElementById('path-result');

    if (!found) {
        pathResult.style.display = 'block';
        pathResult.innerHTML = '<span style="color:#e74c3c">Không tìm thấy đường đi!</span>';
        return;
    }

    // Reconstruct path
    const path = [];
    let node = to;
    while (node !== -1) {
        path.unshift(node);
        node = parent[node];
    }

    // Highlight path
    const pathEdges = [];
    for (let i = 0; i < path.length - 1; i++) {
        const e = edgesData.find(e =>
            (e.from === path[i] && e.to === path[i+1]) ||
            (e.from === path[i+1] && e.to === path[i])
        );
        if (e) pathEdges.push(edges.get().findIndex(x => x.from === e.from && x.to === e.to));
    }
    network.selectNodes(path);

    const stepsHtml = path.map((nid, i) => {
        const n = nodesData.find(n => n.id === nid);
        const name = n ? n.label : `Map ${nid}`;
        const sep = i < path.length - 1 ? '<span class="sep">→</span>' : '';
        return `<span class="step" onclick="focusNode(${nid})" style="cursor:pointer">[${nid}] ${name}</span>${sep}`;
    }).join('');

    pathResult.style.display = 'block';
    pathResult.innerHTML = `
        <strong style="color:#3498db">Đường đi (${path.length - 1} bước):</strong><br>
        ${stepsHtml}
    `;

    document.getElementById('sidebarContent').innerHTML = '';
    document.getElementById('sidebarTitle').textContent = 'Tìm đường đi';

    // Fit view to path
    network.fit({ nodes: path, animation: true });
}

// Filter by type
document.getElementById('filterType').addEventListener('change', function() {
    const type = this.value;
    if (!type) {
        nodes.update(nodesData.map(n => ({ id: n.id, hidden: false })));
        edges.update(edgesData.map((e, i) => ({ id: i, hidden: false })));
    } else {
        const visibleIds = new Set(nodesData.filter(n => n.group === type).map(n => n.id));
        // Also show connected nodes
        nodesData.forEach(n => {
            if (visibleIds.has(n.id)) {
                (adj[n.id] || []).forEach(cid => visibleIds.add(cid));
            }
        });
        nodes.update(nodesData.map(n => ({ id: n.id, hidden: !visibleIds.has(n.id) })));
    }
});

function resetView() {
    nodes.update(nodesData.map(n => ({ id: n.id, hidden: false })));
    network.fit({ animation: true });
    document.getElementById('filterType').value = '';
    document.getElementById('searchInput').value = '';
    document.getElementById('sidebar').classList.remove('active');
    document.getElementById('path-result').style.display = 'none';
    network.unselectAll();
}
